name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 16
        uses: actions/setup-java@v5
        with:
          java-version: '16'
          distribution: 'temurin'

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译Debug包
        run: ./gradlew assembleDebug

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
